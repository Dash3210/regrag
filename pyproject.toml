[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regrag"
version = "0.1.0"
description = "Citation-grounded retrieval and evaluation over multi-year technical regulations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "requests>=2.31,<3",
    "pdfplumber>=0.11,<1",
    "numpy>=2.0,<3",
    "sentence-transformers>=3.0,<6",
    "pydantic>=2.7,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "prometheus-client>=0.20,<1",
]

[project.scripts]
regrag = "regrag.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx2>=2.14,<3",
    "ruff>=0.11,<1",
    "mypy>=1.11,<3",
    "types-requests>=2.31,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regrag = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["regrag"]

[tool.coverage.report]
fail_under = 85
